plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = "1.21.1"
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // CobbleCompanion: Basis + CobbleCompanion: CobbleDollars - NUR zum Kompilieren (compileOnly),
    // beide zur Laufzeit als eigene, separat installierte required-Mods erwartet (siehe
    // neoforge.mods.toml), NIE mitgebuendelt. Jars via "./gradlew jar" in den jeweiligen Repos
    // bauen und hier in libs/ ablegen (gleiches Vorgehen wie in CobbleCompanion-CobbleDollars-Create).
    compileOnly fileTree(dir: 'libs', include: ['CobbleCompanion-Basis*.jar', 'CobbleCompanion-CobbleDollars-[0-9]*.jar'])

    // Fuer den Dev-Run (runClient/runServer) muessen alle Abhaengigkeiten tatsaechlich geladen
    // sein. implementation statt compileOnly NUR hier, damit sie im Dev-Run mitgeladen werden -
    // eingebettet wird trotzdem nichts (Gradles jar-Task bettet fileTree-Jars nie ins gebaute Jar
    // ein - gleiches Muster wie in CobbleCompanion/build.gradle).
    implementation fileTree(dir: 'libs', include: [
        'CobbleCompanion-Basis*.jar', 'CobbleCompanion-CobbleDollars-[0-9]*.jar',
        'Cobblemon*.jar', 'CobbleDollars*.jar', 'CustomNPCs*.jar', 'create-*.jar',
        // Ponder ist innerhalb der Create-Jar per Jar-in-Jar gebündelt (META-INF/jarjar/) und
        // dadurch nicht automatisch auf dem Compile-Classpath - StockTickerBlockEntity.
        // getRecentSummary() gibt einen Ponder-Typ zurück, siehe CobbleCompanion/build.gradle.
        'ponder*.jar'
    ])

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21'
}

processResources {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
